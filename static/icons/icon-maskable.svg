<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="TUPAS Reviewer Mascot (Maskable)">
  <defs>
    <linearGradient id="tupasLime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6f50b"/>
      <stop offset="100%" stop-color="#9fe800"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for Android adaptive icon clipping -->
  <rect width="512" height="512" fill="#A8EE00"/>
  <rect width="512" height="512" fill="url(#tupasLime)"/>

  <!-- TUPAS Mascot centered in 80% safe zone circle -->
  <g id="mascot-face" transform="translate(86, 92) scale(1.42)">
    <!-- Top Sprout Leaf / Hair Tuft -->
    <ellipse cx="113" cy="22" rx="10" ry="15" transform="rotate(20 113 22)" fill="#FAF7EE" />
    <ellipse cx="126" cy="21" rx="12" ry="17" transform="rotate(42 126 21)" fill="#FAF7EE" />

    <!-- Thick Navy Eyebrows -->
    <path d="M48 56 Q68 42 86 54" stroke="#080E2C" stroke-width="7.5" fill="none" stroke-linecap="round" />
    <path d="M154 54 Q172 42 192 56" stroke="#080E2C" stroke-width="7.5" fill="none" stroke-linecap="round" />

    <!-- Left Big Eye -->
    <circle cx="70" cy="108" r="42" fill="#FFFFFF" />
    <circle cx="76" cy="112" r="22" fill="#080E2C" />
    <circle cx="67" cy="103" r="7" fill="#FFFFFF" />
    <circle cx="84" cy="121" r="3.8" fill="#FFFFFF" />

    <!-- Right Big Eye -->
    <circle cx="170" cy="108" r="42" fill="#FFFFFF" />
    <circle cx="176" cy="112" r="22" fill="#080E2C" />
    <circle cx="167" cy="103" r="7" fill="#FFFFFF" />
    <circle cx="184" cy="121" r="3.8" fill="#FFFFFF" />

    <!-- Cute Nostrils -->
    <ellipse cx="112" cy="158" rx="3.5" ry="4.5" fill="#080E2C" />
    <ellipse cx="128" cy="158" rx="3.5" ry="4.5" fill="#080E2C" />
  </g>
</svg>
