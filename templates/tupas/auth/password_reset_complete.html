{% load static %}
<!doctype html>
<html lang="en" class="plopp-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Password Reset Complete · TUPAS Reviewer</title>
  <link href="{% static 'vendor/bootstrap-icons.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <link href="{% static 'css/auth-common.css' %}" rel="stylesheet">
  <link href="{% static 'css/login.css' %}" rel="stylesheet">
</head>
<body class="plopp-auth-body">
  <div class="plopp-auth-page plopp-auth-bg">
    <div class="plopp-auth-card">
      <div class="plopp-auth-heading">Password reset complete</div>
      <p class="plopp-switch-link">
        Your password has been set. You can now <a href="{% url 'tupas:login' %}">log in</a>.
      </p>
    </div>
  </div>
  <script src="{% static 'js/tupas.js' %}"></script>
</body>
</html>
