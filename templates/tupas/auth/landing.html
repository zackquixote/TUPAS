{% load static %}
<!doctype html>
<html lang="en" class="plopp-html">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7EE">
  <meta name="description" content="TUPAS Reviewer — flip cards, smart highlights, enumeration drills, and exams.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TUPAS">
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="icon" href="{% static 'icons/icon.svg' %}" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <title>Welcome · TUPAS Reviewer</title>
  <link href="{% static 'vendor/bootstrap-icons.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/auth-common.css' %}" rel="stylesheet">
  <link href="{% static 'css/landing.css' %}" rel="stylesheet">
</head>

<body class="plopp-auth-body">

  <div class="plopp-landing-wrapper">

    <div class="plopp-landing">

      <!-- Decorative Circles (Top-Left Lime, Top-Right Navy, Right-Edge Periwinkle) -->
      <div class="plopp-blob-tl" aria-hidden="true"></div>
      <div class="plopp-blob-tr" aria-hidden="true"></div>
      <div class="plopp-blob-mid" aria-hidden="true"></div>

      <!-- Main Content -->
      <div class="plopp-landing-content">
        <h1 class="plopp-landing-title">Let&rsquo;s pop<br>some tasks!</h1>
        <p class="plopp-landing-sub">
          Say goodbye to procrastination.<br>
          Welcome to TUPAS.
        </p>

        <a href="{% url 'tupas:register' %}" class="plopp-btn-primary">Sign Up</a>
        <a href="{% url 'tupas:login' %}" class="plopp-btn-outline">Log In</a>
      </div>

      <!-- Mascot Dome Peeking from Bottom (Exact Match to Image) -->
      <div class="plopp-mascot-landing" aria-hidden="true">
        <svg viewBox="0 0 360 225" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
          <!-- Top Green Hair Tuft -->
          <ellipse cx="171" cy="24" rx="11" ry="17" transform="rotate(20 171 24)" fill="#A8EE00" />
          <ellipse cx="186" cy="22" rx="13" ry="19" transform="rotate(42 186 22)" fill="#A8EE00" />

          <!-- Full-Width Curved Lime Mascot Dome -->
          <path d="M -30 225 C -30 85, 60 28, 180 28 C 300 28, 390 85, 390 225 Z" fill="#A8EE00" />

          <!-- Thick Navy Eyebrows -->
          <path d="M 90 78 Q 112 64 132 76" stroke="#080E2C" stroke-width="8" fill="none" stroke-linecap="round" />
          <path d="M 228 76 Q 248 64 270 78" stroke="#080E2C" stroke-width="8" fill="none" stroke-linecap="round" />

          <!-- Left Eye -->
          <circle cx="116" cy="136" r="46" fill="#FFFFFF" />
          <circle cx="122" cy="140" r="24" fill="#080E2C" class="plopp-mascot-eyes" />
          <circle cx="112" cy="130" r="7.5" fill="#FFFFFF" />
          <circle cx="131" cy="150" r="4.2" fill="#FFFFFF" />

          <!-- Right Eye -->
          <circle cx="244" cy="136" r="46" fill="#FFFFFF" />
          <circle cx="250" cy="140" r="24" fill="#080E2C" class="plopp-mascot-eyes" />
          <circle cx="240" cy="130" r="7.5" fill="#FFFFFF" />
          <circle cx="259" cy="150" r="4.2" fill="#FFFFFF" />

          <!-- Cute Nostrils -->
          <ellipse cx="171" cy="192" rx="3.8" ry="5" fill="#080E2C" />
          <ellipse cx="189" cy="192" rx="3.8" ry="5" fill="#080E2C" />
        </svg>
      </div>

    </div>

  </div>

  <script src="{% static 'js/tupas.js' %}"></script>
</body>

</html>
