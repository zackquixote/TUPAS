<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="TUPAS — Study and Exam Reviewer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a333e"/>
      <stop offset="0.55" stop-color="#1d232a"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.8" cy="0.14" r="0.62">
      <stop offset="0" stop-color="#ff6b9d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6b9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0.12" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa1c0"/>
      <stop offset="1" stop-color="#ff5b92"/>
