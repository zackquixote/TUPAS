  <text x="256" y="404" text-anchor="middle" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="4" fill="#ffffff" textLength="328" lengthAdjust="spacingAndGlyphs">TUPAS</text>
