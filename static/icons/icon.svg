  </g>
  <circle cx="106" cy="288" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="410" cy="302" r="4" fill="#ffd166" opacity="0.9"/>
  <circle cx="388" cy="128" r="3.5" fill="#c7d2fe" opacity="0.8"/>

