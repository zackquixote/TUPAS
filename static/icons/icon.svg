      <stop offset="1" stop-color="#ffe6ef"/>
    </linearGradient>
    <filter id="bookShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowPink)"/>
  <rect width="512" height="512" fill="url(#glowIndigo)"/>

